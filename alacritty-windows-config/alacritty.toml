[terminal]
shell = { program = "C:\\Windows\\System32\\wsl.exe", args = ["--cd", "~"] }

[font]
size = 12
builtin_box_drawing = false
# Increase 'offset.y' to add empty space between your lines.
offset = { x = 0, y = 3 }
# If your text selection highlights look misaligned or cut off, 
glyph_offset = { x = 0, y = 2 }

[font.normal]
family = "CaskaydiaCove Nerd Font Mono"
style = "Regular"

[font.bold]
family = "CaskaydiaCove Nerd Font Mono" 
style = "Bold"

[font.italic]
family = "CaskaydiaCove Nerd Font Mono"
style = "Italic"

[font.bold_italic]
family = "CaskaydiaCove Nerd Font Mono"

style = "Bold Italic"

[[hints.enabled]]
regex = "[^ ]+\\.rs:\\d+:\\d+"
command = { program = "code", args = [ "--goto" ] }

mouse = { enabled = true }

[window]
padding = {x = 0, y = 0}
dynamic_padding = true
#decorations = "buttonless"                       # Only works in macos
startup_mode = "Maximized"
# opacity = 1


[mouse]
hide_when_typing = false

[cursor]
style = { shape = "Block", blinking = "Never" }   # block cursor, no blinking
vi_mode_style = "Block"                           # use block for vi mode too
blink_interval = 750
blink_timeout = 0                                 # never stop blinking
unfocused_hollow = false                          # solid block when unfocused
thickness = 1.0                                   # full width of the cell

[general]

import = ["vague.toml"]

[keyboard]
bindings = [
  # Send NUL (what tmux reads as C-Space) so Ctrl+Shift+Space opens tmux copy mode
  { key = "Space", mods = "Control|Shift", chars = "\u0000" },
]

