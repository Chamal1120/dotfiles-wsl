unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded :)"

unbind C-b
set -g prefix C-s
bind-key C-s send-prefix
set-option -g status on
set-option -g status-position top

# Enable automatic rename of windows and panes
set -wg automatic-rename on
set -g allow-rename off

# Term settings
set -g default-terminal "$TERM"
set -ag terminal-overrides ",$TERM:Tc"

set-option -g default-shell /bin/zsh

set -g mouse on
set -s escape-time 0
set -g focus-events on
set-option -s set-clipboard on

# Enable vi mode
setw -g mode-keys vi

bind -n C-Space copy-mode
bind -T copy-mode-vi i send -X cancel

# Unbind conflicting keys
unbind -T copy-mode-vi Space
unbind -T copy-mode-vi v
unbind -T copy-mode-vi V
unbind -T copy-mode-vi C-v
unbind -T copy-mode-vi y
unbind -T copy-mode-vi Y
unbind -T copy-mode-vi d
unbind -T copy-mode-vi D
unbind -T copy-mode-vi h
unbind -T copy-mode-vi j
unbind -T copy-mode-vi k
unbind -T copy-mode-vi l
unbind -T copy-mode-vi w
unbind -T copy-mode-vi e
unbind -T copy-mode-vi b
unbind -T copy-mode-vi $
unbind -T copy-mode-vi 0
unbind -T copy-mode-vi ^
unbind -T copy-mode-vi G
unbind -T copy-mode-vi g
unbind -T copy-mode-vi / 
unbind -T copy-mode-vi ?
unbind -T copy-mode-vi n
unbind -T copy-mode-vi N

# Fix selection behavior
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi e send -X end-of-word

# Fix movement to match Vim
bind -T copy-mode-vi h send -X cursor-left
bind -T copy-mode-vi l send -X cursor-right
bind -T copy-mode-vi j send -X cursor-down
bind -T copy-mode-vi k send -X cursor-up
bind -T copy-mode-vi w send -X next-word
bind -T copy-mode-vi e send -X end-of-word
bind -T copy-mode-vi b send -X previous-word
bind -T copy-mode-vi $ send -X end-of-line
bind -T copy-mode-vi 0 send -X start-of-line
bind -T copy-mode-vi ^ send -X back-to-indentation
bind -T copy-mode-vi G send -X history-bottom
bind -T copy-mode-vi g send -X history-top

# Fix copy behavior - use copy-pipe for clipboard integration
# Try xclip first, then wl-copy (Wayland), then fallback to copy-selection
bind -T copy-mode-vi y send -X copy-pipe "xclip -selection clipboard 2>/dev/null || wl-copy 2>/dev/null" \; send -X clear-selection
bind -T copy-mode-vi Y send -X copy-pipe "xclip -selection clipboard 2>/dev/null || wl-copy 2>/dev/null" \; send -X cancel
bind -T copy-mode-vi d send -X copy-pipe "xclip -selection clipboard 2>/dev/null || wl-copy 2>/dev/null" \; send -X clear-selection
bind -T copy-mode-vi D send -X copy-pipe "xclip -selection clipboard 2>/dev/null || wl-copy 2>/dev/null" \; send -X cancel

# Fix search behavior
bind -T copy-mode-vi / send -X search-forward
bind -T copy-mode-vi ? send -X search-backward
bind -T copy-mode-vi n send -X search-again
bind -T copy-mode-vi N send -X search-reverse

bind -T copy-mode-vi Escape send -X clear-selection
bind -T copy-mode-vi Enter send -X cancel

# Pane navs
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

set -g window-status-separator " "
set -g status-style "fg=white,bg=#1c1c24"

# Left status
set -g status-left-length 100
set -gF status-left ""
setw -g window-status-format "#[fg=black,bg=brightwhite] #I #[fg=white,bg=black] #W "
setw -g window-status-current-format "#[fg=black,bg=yellow] #I #[fg=white,bg=black] #W "

# Right status
set -g status-right '#[fg=black,bg=#aeaed1] sesh: #S #[default]'
set -g status-right-length 100

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
run '~/.tmux/plugins/tpm/tpm'

# This breaks ctrl + l right pane navigation (since I don't use panes, idc)
unbind -T root C-l
bind -n C-l send-keys C-l
